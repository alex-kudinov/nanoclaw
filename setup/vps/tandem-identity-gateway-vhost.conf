<?xml version="1.0" encoding="UTF-8"?>
<virtualHostConfig>
  <docRoot>/tmp</docRoot>
  <maxReqBodyLen>4096</maxReqBodyLen>
  <extProcessorList>
    <extProcessor>
      <type>proxy</type>
      <name>n8nIdentityGatewayBackend</name>
      <address>127.0.0.1:5678</address>
      <maxConns>16</maxConns>
      <initTimeout>5</initTimeout>
      <retryTimeout>0</retryTimeout>
      <respBuffer>0</respBuffer>
    </extProcessor>
  </extProcessorList>
  <contextList>
    <context>
      <type>proxy</type>
      <uri>/webhook/tandem-identity-binding-v1</uri>
      <handler>n8nIdentityGatewayBackend</handler>
      <addDefaultCharset>off</addDefaultCharset>
    </context>
  </contextList>
  <vhssl>
    <keyFile>/etc/letsencrypt/live/tandemcoach.co/privkey.pem</keyFile>
    <certFile>/etc/letsencrypt/live/tandemcoach.co/fullchain.pem</certFile>
    <certChain>1</certChain>
    <renegProtection>1</renegProtection>
    <sslSessionTickets>1</sslSessionTickets>
    <enableSpdy>15</enableSpdy>
    <enableQuic>1</enableQuic>
  </vhssl>
</virtualHostConfig>
